services:
  postgres:
    image: postgres:16-alpine
    container_name: ashenhost-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ashenhost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashenhost_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ashenhost_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ashenhost} -d ${POSTGRES_DB:-ashenhost_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ashenhost-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ashenhost-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ashenhost}:${POSTGRES_PASSWORD:-ashenhost_secret_pass}@postgres:5432/${POSTGRES_DB:-ashenhost_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_pass}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_pass}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-key-change-this-in-production}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: ashenhost-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ashenhost}:${POSTGRES_PASSWORD:-ashenhost_secret_pass}@postgres:5432/${POSTGRES_DB:-ashenhost_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret_pass}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret_pass}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
